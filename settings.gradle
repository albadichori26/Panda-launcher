name:Panda Launcher APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build Debug APK with Gradle
      run: gradle assembleDebug

    - name: Rename APK
      run: |
        mkdir -p output
        cp app/build/outputs/apk/debug/app-debug.apk output/panda-launcher.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: panda-launcher.apk
        path: output/panda-launcher.apk
